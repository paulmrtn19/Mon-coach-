    if (s.z === "rec" && st[i - 1] && st[i - 1].z !== "rec" && st[i - 1].z !== "easy") { i++; continue; }
    out.push({ z: s.z, label: s.name, desc: `${s.pace ? (s.z === "easy" ? "≈ " : "à ") + fmtPace(s.pace) + "/km" : ""}${s.note ? (s.pace ? " · " : "") + esc(s.note) : ""}${s.z === "easy" && hrZone("easy") ? " · cardio " + hrZone("easy") : ""}`, right: s.km && s.z !== "easy" ? s.km + " km" : fDur(s.sec / 60) });
    i++;
  }
  return out;
}

/* ====== BILAN D'UNE SÉANCE VALIDÉE ====== */
function vBilan(s, a, w, pos, n, st, main, tot) {
  const pace = a.distanceKm && a.dureeMin ? a.dureeMin * 60 / a.distanceKm : null, pPace = tot / s.km;
  const sgn = (x, f) => (x > 0 ? "+" : x < 0 ? "−" : "±") + f(Math.abs(x));
  const cell = (k, v, u = "") => `<div><div class="k">${k}</div><div class="v">${v}${u ? `<small>${u}</small>` : ""}</div></div>`;
  const row2 = [a.fcMoy ? cell("Cardio moy.", a.fcMoy, "bpm") : "", a.fcMax ? cell("Cardio max", a.fcMax, "bpm") : "", cell("Effort", a.rpe, "/10")].filter(Boolean);
  const row3 = [a.cadence ? cell("Cadence", a.cadence, "pas/min") : "", a.deniv ? cell("Dénivelé", a.deniv, "m") : ""].filter(Boolean);
  const dKm = a.distanceKm != null ? a.distanceKm - s.km : null, dMin = a.dureeMin - tot / 60, dPace = pace ? pace - pPace : null;
  const tgt = a.repTarget || (main && main.z !== "easy" ? main.pace : null);
  return `<div class="top" style="align-items:center"><button class="iconbtn" data-a="back" aria-label="Retour">${I.left}</button><span class="muted small">Semaine ${w.n} · séance ${pos}/${n}</span></div>
  <div class="sec" style="margin-top:16px"><span class="st st-ok">Validée</span><h1 style="margin-top:8px">${esc(s.titre)}</h1><p class="muted" style="margin-top:2px">${fDay(a.date).replace(/^./, c => c.toUpperCase())}</p></div>
  <div class="card sec"><div class="statstrip">${cell("Distance", a.distanceKm ?? "–", "km")}${cell("Durée", fDur(a.dureeMin))}${cell("Allure", pace ? fmtPace(pace) : "–", "/km")}</div>
    <div class="statstrip" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line2);grid-template-columns:repeat(${row2.length},1fr)">${row2.join("")}</div>
    ${row3.length ? `<div class="statstrip" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line2);grid-template-columns:repeat(${row3.length},1fr)">${row3.join("")}</div>` : ""}</div>
  <div class="card sec"><div class="row between small"><span class="muted">Prévu</span><span class="num">${s.km} km · ${fDur(tot / 60)} · ${fmtPace(pPace)}/km</span></div>
    <div class="row between small" style="margin-top:6px"><span class="muted">Écart</span><span class="num">${dKm != null ? sgn(dKm, x => r1(x) + " km") : "–"} · ${sgn(dMin, x => fDur(x))}${dPace != null ? " · " + sgn(dPace, x => Math.round(x) + " s/km") : ""}</span></div></div>
  ${a.reps ? repsSummary(a, tgt) : ""}
  ${a.douleur ? `<div class="alert"><b>Douleur signalée</b>${typeof a.douleur === "string" ? " : " + esc(a.douleur) : ""}</div>` : ""}
  ${a.notes ? `<div class="card sec"><p style="color:var(--ink2)">${esc(a.notes)}</p></div>` : ""}
  <div class="card sec"><details class="why" style="margin-top:0"><summary>Voir la séance prévue</summary><div style="margin-top:10px">${stepsChart(st)}</div>${groupSteps(st).map((g, i) => `<div class="jr"><div class="sq" style="background:${ZONE[g.z].c}">${i + 1}</div><div class="grow"><b>${esc(g.label)}</b><div class="xs muted">${g.desc}</div></div><div class="num" style="font-weight:700">${g.right}</div></div>`).join("")}<p class="small" style="margin-top:10px;color:var(--ink2)">${esc(s.mot)}</p></details></div>
  <div class="acts sec"><button class="btn btn-o btn-b" data-a="editact" data-id="${a.id}">Modifier les données</button></div>`;
}

/* ====== PROGRESSION MESURÉE ET PROJECTION JOUR J ====== */
const REP_TYPES = ["T", "I", "R", "HM", "X"];
// Niveau estimé à partir d'une séance de fractions : allure moyenne des fractions → VDOT équivalent.
function sessionVdot(a) {
  if (!a.reps || !a.reps.length) return null;
  const ok = a.reps.filter(r => r.d > 0 && r.s > 0); if (!ok.length) return null;
  const d = ok.reduce((x, r) => x + r.d, 0), s = ok.reduce((x, r) => x + r.s, 0), pace = s / (d / 1000);
  const v = 60000 / pace, VO2 = vo2(v);
  let frac = null, w = 1;
  if (a.type === "T") frac = 0.88;
  else if (a.type === "I" && d / ok.length >= 600) frac = 0.98;
  else if (a.type === "HM") { frac = 0.84; w = 0.6; }
  if (!frac) return null;
  if (a.rpe >= 9) w *= 0.5; else if (a.rpe <= 5) w *= 0.7;
  const vd = VO2 / frac;
  if (S.plan && Math.abs(vd - S.plan.vdot) > 8) return null; // saisie probablement erronée
  return { date: a.date, vdot: vd, w, pace };
}
function progressObs(kind) {
  const obs = [];
  if (kind === "tests") (S.plan?.vdotHist || []).forEach(h => obs.push({ date: h.date, vdot: h.vdot, w: 1 }));
  else S.acts.filter(a => a.sport === "course").forEach(a => { const o = sessionVdot(a); if (o) obs.push(o); });
  return obs.sort((a, b) => a.date.localeCompare(b.date));
}
function slopeOf(obs) {
  if (obs.length < 2 || daysBetween(obs[0].date, obs[obs.length - 1].date) < 14) return null;
  const xs = obs.map(o => daysBetween(obs[0].date, o.date) / 7), W = obs.reduce((a, o) => a + o.w, 0);
  const mx = obs.reduce((a, o, i) => a + o.w * xs[i], 0) / W, my = obs.reduce((a, o) => a + o.w * o.vdot, 0) / W;
  let sxy = 0, sxx = 0; obs.forEach((o, i) => { sxy += o.w * (xs[i] - mx) * (o.vdot - my); sxx += o.w * (xs[i] - mx) ** 2; });
  return sxx ? sxy / sxx : null;
}
// Pente mesurée : séances de fractions entre elles (même méthode), et tests/courses entre eux. Jamais mélangés, pour éviter les biais.
function measuredRate() {
  const t = today(), lim = addD(t, -63);
  const ses = progressObs("sessions").filter(o => o.date >= lim), tst = progressObs("tests").filter(o => o.date >= addD(t, -120));
  const a = ses.length >= 3 ? slopeOf(ses) : null, b = tst.length >= 2 ? slopeOf(tst) : null;
  if (a == null && b == null) return null;
  const wa = a == null ? 0 : ses.length, wb = b == null ? 0 : tst.length * 3;
  return { slope: ((a || 0) * wa + (b || 0) * wb) / (wa + wb), n: (a == null ? 0 : ses.length) + (b == null ? 0 : tst.length) };
}
/* Prédiction en deux temps.
   - Aujourd'hui : temps équivalent 10 km (niveau actuel) étendu à la distance avec un facteur de fatigue.
     Riegel (1981) utilise 1,06 pour tout le monde ; Vickers & Vertosick (BMC Sports Sci Med Rehabil, 2016) montrent que
     le ralentissement personnel entre deux courses (ex. 10 km et semi) prédit mieux. On calcule donc ton facteur à partir
     de ton record sur la distance, pondéré selon son ancienneté (tu as pu progresser depuis).
     Sans record : facteur moyen, corrigé si ta plus longue sortie récente est courte pour la distance.
   - Jour J : niveau projeté (progression mesurée ou estimée) + réduction de l'écart d'endurance par le plan
     (60 % avec 3 sorties, 70 % avec 4 et plus, réduit si le plan n'est pas suivi). Ces deux taux sont des choix de l'appli. */
function fatigueK(vdot, q, dk, longest) {
  const kPop = 1.06, D = dk / 10;
  const rec = q.rec ? raceMin(q.rec, dk) : 0, perf = q.perfT ? raceMin(q.perfT, q.perfD) : 0;
  if (rec && perf && q.perfD && q.perfD < dk * 0.8) {
    const kp = clamp(Math.log(rec / perf) / Math.log(dk / q.perfD), 1.0, 1.25);
    const w = { "<1": 0.75, "1-2": 0.5, "2+": 0.25 }[q.recAge] ?? 0.5;
    return { k: kPop + w * (kp - kPop), kp, src: "record" };
  }
  const need = dk > 30 ? 30 : dk > 15 ? 16 : 0;
  const pen = need ? clamp((need - (longest || need)) / need * (need === 30 ? 0.10 : 0.06), 0, 0.10) : 0;
  let k = kPop + (pen && D > 1 ? Math.log(1 + pen) / Math.log(D) : 0);
  const exp = q.exp ?? 2; if (exp < 2 && D > 1) k += ({ 5: 0, 10: 0.01, 21.1: 0.03, 42.2: 0.06 }[distKey(dk)] || 0) * (exp === 0 ? 1 : 0.5) / Math.log(D);
  return { k, kp: null, src: pen ? "sortie longue courte" : "moyenne" };
}
function predAt(vdot, dk, k) { return predictSec(vdot, 10000) * Math.pow(dk / 10, dk > 10 ? k : 1.06); }
function projection() {
  const p = S.plan; if (!p) return null;
  const t = today(), weeksLeft = Math.max(0, daysBetween(t, p.prm.raceDate) / 7), dk = p.prm.distKm;
  const prior = { "0-6": 0.25, "6-24": 0.15, "24+": 0.08 }[p.q.anc] ?? 0.15;
  const m = measuredRate();
  const kk = 6, rate = m ? clamp((prior * kk + m.slope * m.n) / (kk + m.n), -0.3, 0.3) : prior;
  const c = compliance(), adh = c && c.planned > 15 ? clamp(c.done / c.planned, 0.5, 1) : 1;
  const start = p.vdotHist[0].vdot;
  const effWeeks = Math.max(0, weeksLeft - 2) * 0.8;
  const gain = clamp(rate * effWeeks * adh, -3, Math.max(0, start + 4 - p.vdot));
  const vR = p.vdot + gain, sd = 0.6 + 0.12 * weeksLeft;
  const l30 = refLongest(addD(t, 1));
  // Facteur de fatigue de départ (questionnaire), puis mise à jour par tes données réelles :
  // 1) une course ou un test de 15 km et plus recalcule directement ton facteur personnel ;
  // 2) sinon, l'écart d'endurance se réduit au rythme de ta sortie longue réellement courue (vers ~80 % de la distance).
  const F0 = fatigueK(p.vdot, p.q, dk, p.q.longest), kPop = 1.06;
  const longRace = S.acts.filter(a => a.sport === "course" && (a.type === "RACE" || a.type === "TEST") && a.distanceKm >= 15 && a.date >= p.createdAt).sort((a, b) => b.date.localeCompare(a.date))[0];
  let kStart = F0.k, kSrc = F0.src;
  if (longRace) { const t10 = predictSec(p.vdot, 10000) / 60; kStart = clamp(Math.log(longRace.dureeMin / t10) / Math.log(longRace.distanceKm / 10), 1.0, 1.25); kSrc = "course longue"; }
  const Lpeak = Math.min(dk * 0.8, 32), L0 = Math.min(p.q.longest || l30, Lpeak);
  const progress = Lpeak > L0 ? clamp((l30 - L0) / (Lpeak - L0), 0, 1) : 1;
  const closureMax = p.prm.runs >= 4 ? 0.7 : 0.6;
  const kNow = longRace ? kStart : kPop + (kStart - kPop) * (1 - closureMax * progress * adh);
  const closure = closureMax * adh;
  const kRace = Math.min(kNow, kPop + (kStart - kPop) * (1 - closure));
  const F = { k: kNow, kp: F0.kp, src: kSrc };
  const now = predAt(p.vdot, dk, F.k);
  return {
    now, nowAdj: now, endPen: 0, l30, firstPen: 0, kNow: F.k, kStart, kRace, kp: F.kp, kSrc: F.src, closure, progress,
    race: predAt(vR, dk, kRace), lo: predAt(vR + sd, dk, kRace - 0.01), hi: predAt(vR - sd, dk, kRace + 0.01),
    equiv: predictSec(p.vdot, dk * 1000), rate, measured: !!m, nObs: m ? m.n : 0, adh, weeksLeft, vR
  };
}
function snapshotProjection() {
  const p = S.plan; if (!p) return; const pr = projection(), t = today();
  p.projHist = p.projHist || [];
  const last = p.projHist[p.projHist.length - 1];
  const rec = { date: t, sec: Math.round(pr.race), lo: Math.round(pr.lo), hi: Math.round(pr.hi) };
  if (last && last.date === t) p.projHist[p.projHist.length - 1] = rec; else p.projHist.push(rec);
  p.projHist = p.projHist.slice(-120); save();
}
function projChart(h, cible) {
  if (h.length < 2) return "";
  const W = 340, H = 150, pl = 44, pb = 18, pt = 10;
  const vals = h.flatMap(x => [x.lo, x.hi]).concat(cible ? [cible] : []);
  const mn = Math.min(...vals) - 30, mx = Math.max(...vals) + 30;
  const X = i => pl + i * (W - pl - 6) / (h.length - 1), Y = v => pt + (H - pb - pt) * (v - mn) / (mx - mn);
  const band = h.map((x, i) => `${X(i)},${Y(x.lo)}`).join(" ") + " " + h.slice().reverse().map((x, i) => `${X(h.length - 1 - i)},${Y(x.hi)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><polygon points="${band}" fill="var(--accent)" opacity=".12"/>
  <polyline fill="none" stroke="var(--accent)" stroke-width="2.2" points="${h.map((x, i) => `${X(i)},${Y(x.sec)}`).join(" ")}"/>
  ${cible ? `<line x1="${pl}" x2="${W}" y1="${Y(cible)}" y2="${Y(cible)}" stroke="var(--c-HM)" stroke-dasharray="4 4"/><text x="${W}" y="${Y(cible) - 4}" text-anchor="end" style="fill:var(--c-HM)">cible ${fmtTime(cible)}</text>` : ""}
  <text x="0" y="${pt + 8}">${fmtTime(mn + 30)}</text><text x="0" y="${H - pb}">${fmtTime(mx - 30)}</text><text x="${pl}" y="${H - 3}">${fShort(h[0].date)}</text><text x="${W}" y="${H - 3}" text-anchor="end">${fShort(h[h.length - 1].date)}</text></svg>
`;
}

/* ====== FRACTIONS : SAISIE ET ANALYSE ====== */
function repTemplate(sess) {
  if (!sess) return null;
  const st = stepsFor(sess).filter(x => !["easy", "rec"].includes(x.z) && x.z !== "race");
  if (!st.length || st.length > 12 || st.every(x => !x.km && x.sec < 90)) return null;   // 30/30, côtes, fartlek : pas de saisie fraction par fraction
  return { target: st[0].pace || null, reps: st.map(x => x.km ? { mode: "d", d: Math.round(x.km * 1000), s: null } : { mode: "t", s: Math.round(x.sec), d: null }) };
}
function repsEditor(f) {
  const tgt = f.repTarget;
  const rows = (f.reps || []).map((r, i) => {
    const pace = r.d && r.s ? r.s / (r.d / 1000) : null, dev = pace && tgt ? (pace / tgt - 1) * 100 : null;
    const devTxt = dev == null ? "" : Math.abs(dev) <= 2 ? `<span class="good">dans la cible</span>` : dev < 0 ? `<span class="warn">${Math.abs(dev).toFixed(0)} % trop vite</span>` : `<span class="warn">${dev.toFixed(0)} % trop lent</span>`;
    return `<div class="rep"><span class="num rn">${i + 1}</span>
      ${r.mode === "d" ? `<span class="small muted rl">${r.d} m</span><input class="inp num" data-rep="${i}" data-f="s" value="${r.s ? durStr(r.s / 60) : ""}" placeholder="temps" aria-label="Temps de la fraction ${i + 1}">`
        : `<span class="small muted rl">${fDur(r.s / 60).replace(" min", "’")}</span><input class="inp num" data-rep="${i}" data-f="d" inputmode="numeric" value="${r.d || ""}" placeholder="mètres" aria-label="Distance de la fraction ${i + 1}">`}
      <input class="inp num" data-rep="${i}" data-f="fc" inputmode="numeric" value="${r.fc || ""}" placeholder="cardio" aria-label="Cardio max fraction ${i + 1}">
      <span class="xs rp">${pace ? fmtPace(pace) + "/km · " + devTxt : ""}</span></div>`;
  }).join("");
  return `<div class="card" style="background:var(--surface2)"><div class="row between"><h3>Détail des fractions</h3>${tgt ? `<span class="xs muted">cible ${fmtPace(tgt)}/km</span>` : ""}</div>
    ${f.reps && f.reps.length ? `<div class="reps">${rows}</div><div class="row" style="margin-top:10px"><button class="btn btn-o" data-repcopy="1" style="flex:1;padding:8px">Recopier la 1re partout</button><button class="btn btn-o" data-repadd="1" style="padding:8px 12px">+ 1</button><button class="btn btn-o" data-repdel="1" style="padding:8px 12px">− 1</button></div>`
      : `<div style="height:8px"></div><div class="g3"><input class="inp num" id="rn" inputmode="numeric" placeholder="Nombre" aria-label="Nombre de fractions"><input class="inp num" id="rv" inputmode="numeric" placeholder="Valeur" aria-label="Distance ou durée"><select class="inp" id="ru"><option value="m">mètres</option><option value="min">minutes</option></select></div><button class="btn btn-s btn-b" data-repgen="1" style="margin-top:10px">Créer les lignes</button>`}</div>`;
}
function repsSummary(a, tgt) {
  const ok = (a.reps || []).filter(r => r.d && r.s); if (!ok.length) return "";
  const paces = ok.map(r => r.s / (r.d / 1000)), avg = paces.reduce((x, y) => x + y, 0) / paces.length;
  const sd = Math.sqrt(paces.reduce((x, p) => x + (p - avg) ** 2, 0) / paces.length), cv = sd / avg * 100;
  const W = 340, H = 130, pb = 18, pt = 10, all = paces.concat(tgt ? [tgt] : []), mn = Math.min(...all) - 6, mx = Math.max(...all) + 6;
  const bw = (W - 40) / paces.length, Y = p => pt + (H - pb - pt) * (p - mn) / (mx - mn);
  const sv = sessionVdot(a);
  return `<div class="card sec"><h3>Tes fractions</h3>
  <div class="tiles" style="grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px"><div class="tile"><div class="k">Allure moy.</div><div class="v num">${fmtPace(avg)}</div></div>
  <div class="tile"><div class="k">Écart cible</div><div class="v num ${tgt ? (Math.abs(avg / tgt - 1) <= 0.02 ? "good" : "warn") : ""}" style="font-size:24px">${tgt ? (avg < tgt ? "−" : "+") + Math.round(Math.abs(avg - tgt)) + " s" : "–"}</div></div>
  <div class="tile"><div class="k">Régularité</div><div class="v num ${cv <= 2 ? "good" : cv <= 4 ? "" : "warn"}" style="font-size:24px">${cv.toFixed(1)} %</div></div></div>
  <svg class="chart" viewBox="0 0 ${W} ${H}" style="margin-top:12px">${paces.map((p, i) => `<rect x="${36 + i * bw + bw * .18}" y="${Y(p)}" width="${bw * .64}" height="${H - pb - Y(p)}" rx="3" fill="${tgt && Math.abs(p / tgt - 1) <= 0.02 ? "var(--c-E)" : "var(--c-T)"}"/><text x="${36 + i * bw + bw / 2}" y="${H - 4}" text-anchor="middle">${i + 1}</text>`).join("")}
  ${tgt ? `<line x1="36" x2="${W}" y1="${Y(tgt)}" y2="${Y(tgt)}" stroke="var(--ink)" stroke-dasharray="4 4"/>` : ""}<text x="0" y="${pt + 8}">${fmtPace(mn + 6)}</text><text x="0" y="${H - pb}">${fmtPace(mx - 6)}</text></svg>
  ${sv ? `<p class="small" style="margin-top:8px">Niveau estimé sur cette séance : <b class="num">${sv.vdot.toFixed(1)}</b> <span class="muted">(référence ${S.plan.vdot.toFixed(1)})</span></p>` : ""}</div>`;
}
