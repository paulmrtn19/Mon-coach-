<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Coach</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mon Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0F1A" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--surface2:#F8F9FB;--ink:#0E1726;--ink2:#344054;--muted:#667085;--line:#E4E7EC;
  --accent:#2F4BFF;--accent-ink:#FFFFFF;--accent-soft:#EEF1FF;
  --good:#12805C;--warn:#B54708;--bad:#C0362C;
  --hero:#0E1726;--hero-ink:#FFFFFF;--hero-muted:#98A2B3;
  --c-E:#16A34A;--c-LR:#2563EB;--c-T:#EA580C;--c-I:#DC2626;--c-R:#DB2777;--c-HM:#7C3AED;--c-M:#7C3AED;--c-X:#0891B2;--c-REC:#98A2B3;--c-TEST:#CA8A04;--c-RACE:#0E1726;--c-MU:#475569;--c-AU:#64748B;
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0F1A;--surface:#121A28;--surface2:#0F1622;--ink:#E8ECF4;--ink2:#C3CAD7;--muted:#8A94A6;--line:#222C3D;
  --accent:#6E83FF;--accent-ink:#0A0F1A;--accent-soft:#1A2240;--good:#3CC48E;--warn:#F2A443;--bad:#F2685E;
  --hero:#162036;--hero-ink:#FFFFFF;--hero-muted:#93A0B8;--c-RACE:#E8ECF4;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0A0F1A;--surface:#121A28;--surface2:#0F1622;--ink:#E8ECF4;--ink2:#C3CAD7;--muted:#8A94A6;--line:#222C3D;
  --accent:#6E83FF;--accent-ink:#0A0F1A;--accent-soft:#1A2240;--good:#3CC48E;--warn:#F2A443;--bad:#F2685E;
  --hero:#162036;--hero-ink:#FFFFFF;--hero-muted:#93A0B8;--c-RACE:#E8ECF4;color-scheme:dark;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:"Barlow Condensed","Barlow",system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.app{max-width:600px;margin:0 auto;padding:20px 16px 112px}
h1{font-size:28px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;margin:0;font-weight:700}
h3{font-size:16px;margin:0;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:14px}.xs{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sec{margin-top:28px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;font-size:15px;text-decoration:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card+.card{margin-top:10px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{color:var(--muted);font-size:14px;font-weight:500}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2)}
.iconbtn svg{width:20px;height:20px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-p{background:var(--accent);color:var(--accent-ink)}
.btn-s{background:var(--accent-soft);color:var(--accent)}
.btn-o{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn-d{background:transparent;border:1px solid var(--line);color:var(--bad)}
.btn-b{width:100%}
.btn:disabled{opacity:.5}
.btn svg{width:18px;height:18px}
/* course */
.race{background:var(--hero);color:var(--hero-ink);border-radius:18px;padding:20px;margin-top:18px}
.race .lbl{color:var(--hero-muted);font-size:13px;font-weight:600}
.race h2{font-size:22px;margin-top:2px}
.race .cd{font-size:64px;line-height:.9;font-weight:700}
.race .cd small{font-size:20px;font-weight:600;color:var(--hero-muted);margin-left:4px}
.phasebar{display:flex;gap:3px;margin:16px 0 8px;height:8px}
.phasebar i{display:block;border-radius:3px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
.phasebar i b{position:absolute;inset:0;background:#fff}
.race .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12)}
.race .grid .v{font-size:24px;font-weight:700;line-height:1.1}
.race .grid .k{font-size:12.5px;color:var(--hero-muted)}
/* séances */
.sess{display:flex;gap:12px;align-items:stretch}
.sess .bar{width:4px;border-radius:4px;flex:none}
.tagt{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.tagt i{width:8px;height:8px;border-radius:2px;display:inline-block}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:14px;margin-top:4px}
.meta b{color:var(--ink);font-weight:600}
.note{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:14.5px;color:var(--ink2)}
.note .h{font-size:12.5px;font-weight:700;color:var(--muted);display:block;margin-bottom:2px}
.det{font-size:14.5px;margin-top:8px;color:var(--ink2)}
.st{font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}
.st-ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.st-skip{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.st-miss{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.acts .btn{padding:8px 12px;font-size:14px;border-radius:10px}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:2px 12px;font-size:14px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.cmp .h{color:var(--muted);font-size:12.5px}
/* semaine */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}
.dayc{text-align:center;padding:6px 0 8px;border-radius:10px}
.dayc.today{background:var(--accent-soft)}
.dayc .d{font-size:12px;color:var(--muted);font-weight:600}
.dayc .dot{width:26px;height:26px;border-radius:8px;margin:5px auto 0;display:grid;place-items:center;border:1.5px solid var(--line)}
.dayc .dot.f{border-color:transparent}
.dayc .dot svg{width:15px;height:15px;color:#fff}
.dayc .k{font-size:11.5px;font-weight:600;margin-top:4px;color:var(--ink2)}
.prog{height:8px;border-radius:5px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;position:relative}
.prog i{position:absolute;top:0;bottom:0;left:0;background:var(--accent);border-radius:5px}
.prog s{position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--ink)}
/* indicateurs */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile .k{font-size:13.5px;color:var(--muted);font-weight:600}
.tile .v{font-size:32px;font-weight:700;line-height:1.05;margin-top:6px;white-space:nowrap}
.tile .v small{font-size:16px;color:var(--muted);font-weight:600}
.tile .s{font-size:13.5px;margin-top:4px;font-weight:600}
.good{color:var(--good)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.alert{border-radius:12px;padding:12px 14px;font-size:14.5px;border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);background:color-mix(in srgb,var(--warn) 9%,var(--surface));margin-top:12px}
.alert b{color:var(--warn)}
.info{border-radius:12px;padding:12px 14px;font-size:14.5px;border:1px solid var(--line);background:var(--surface2);margin-top:12px}
/* plan */
.phases{display:flex;gap:3px;margin-top:12px}
.phases button{border:0;height:30px;border-radius:6px;color:#fff;font-size:12px;font-weight:700;padding:0 4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;opacity:.85}
.weeks{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin:12px -2px 0;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;text-align:center;min-width:52px}
.wk .n{font-weight:700;font-size:15px}.wk .km{font-size:12px;color:var(--muted)}
.wk.on{border:2px solid var(--accent)}
.wk.cur .n{color:var(--accent)}
.wk i{display:block;height:3px;border-radius:2px;margin-top:4px}
.dayh{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 6px}
.dayh.today{color:var(--accent)}
/* graphiques */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:"Barlow",sans-serif}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl td{padding:8px 0;border-top:1px solid var(--line)}
.tbl tr:first-child td{border-top:0}
.tbl td:last-child{text-align:right;font-weight:600}
/* formulaires */
label.f{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:6px}
.inp{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:11px 12px;outline:none;font-size:16px}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:72px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stack>*+*{margin-top:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14.5px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 0;font-weight:700;font-size:14px}
.scale button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted);margin-top:5px}
.chk{display:flex;gap:10px;align-items:center;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
/* feuille */
.ov{position:fixed;inset:0;background:rgba(8,12,22,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:94%;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.ov{align-items:center}.sheet{border-radius:20px;max-height:90%}}
.sheet .grab{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.steps{display:flex;gap:4px;margin:12px 0 18px}.steps i{flex:1;height:4px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--accent)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:40}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:62px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--ink)}
.fab{position:fixed;right:max(16px,calc(50% - 284px));bottom:calc(76px + env(safe-area-inset-bottom,0px));height:52px;padding:0 18px 0 14px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;box-shadow:0 8px 20px rgba(47,75,255,.35);z-index:41}
.fab svg{width:22px;height:22px}
.fab[hidden]{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14.5px;z-index:60;max-width:90%}
.empty{text-align:center;padding:28px 16px}
.empty p{color:var(--muted);margin:8px 0 16px}
.jr{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.jr:first-child{border-top:0}
.jr .sq{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;color:#fff;font-weight:700;font-size:12px}
details summary{cursor:pointer;font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}

.tap{cursor:pointer;transition:border-color .15s}
.tap:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.tap:active{transform:scale(.995)}
@media (prefers-reduced-motion:reduce){.tap:active{transform:none}}
.reps{margin-top:10px}
.rep{display:grid;grid-template-columns:20px 54px 1fr 72px;gap:4px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--line2)}
.rep:first-child{border-top:0}
.rep .inp{padding:8px 10px;font-size:15px}
.rep .rn{font-weight:700;color:var(--muted)}
.rep .rl{white-space:nowrap;font-size:13px}
.rep .rp{grid-column:3 / -1;line-height:1.3;text-align:left}
.rep .rp:empty{display:none}
.sess.done{background:color-mix(in srgb,var(--good) 9%,var(--surface));border-color:color-mix(in srgb,var(--good) 35%,var(--line))}
.sess.done .bar{opacity:.5}
.btn-sm{padding:8px 12px;font-size:14px;border-radius:10px}
.btn-ok{background:var(--good);color:#fff;padding:8px 12px;font-size:14px;border-radius:10px}
.btn-ok svg{width:16px;height:16px}

/* ===== Finition v2.7 : plus fin, plus détaillé ===== */
:root{
  --bg:#F5F6F8;--surface:#FFFFFF;--surface2:#F7F8FA;--ink:#15171C;--ink2:#3B404C;--muted:#6F7482;--line:#E6E8EC;--line2:#EEF0F3;
  --accent:#3A5BC7;--accent-soft:#EDF1FA;--hero:#15171C;--hero-muted:#9BA1AE;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0D12;--surface:#14171E;--surface2:#101319;--ink:#ECEEF3;--ink2:#C3C7D1;--muted:#8A8FA0;--line:#232733;--line2:#1B1F28;
  --accent:#7A90DE;--accent-ink:#0B0D12;--accent-soft:#1A2034;--hero:#14171E;--hero-muted:#8A8FA0;}}
:root[data-theme="dark"]{
  --bg:#0B0D12;--surface:#14171E;--surface2:#101319;--ink:#ECEEF3;--ink2:#C3C7D1;--muted:#8A8FA0;--line:#232733;--line2:#1B1F28;
  --accent:#7A90DE;--accent-ink:#0B0D12;--accent-soft:#1A2034;--hero:#14171E;--hero-muted:#8A8FA0;}
body{font-size:15px;letter-spacing:.005em}
.app{padding:16px 14px 104px}
h1{font-size:24px;letter-spacing:-.015em}
h2{font-size:17px;letter-spacing:-.005em}
h3{font-size:15px}
.eyebrow,.tile .k,.race .lbl,label.f,.dayh,.cmp .h,.note .h,.race .grid .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--muted)}
.race .lbl,.race .grid .k{color:var(--hero-muted)}
.sec{margin-top:24px}
.sec-h{margin-bottom:8px}
.card{border-radius:12px;padding:14px;border-color:var(--line)}
.card+.card{margin-top:8px}
.iconbtn{width:36px;height:36px;border-radius:9px}
.iconbtn svg{width:18px;height:18px}
.btn{border-radius:8px;padding:10px 14px;font-size:14.5px}
.btn-sm,.acts .btn{padding:7px 11px;font-size:13.5px;border-radius:7px}
.btn-ok{padding:7px 11px;font-size:13.5px;border-radius:7px}
.link{font-size:14px}
/* carte objectif */
.race{border-radius:14px;padding:18px 16px;margin-top:14px;border:1px solid var(--line)}
:root:not([data-theme="dark"]) .race{border-color:transparent}
.race h2{font-size:19px;margin-top:4px}
.race .cd{font-size:46px;letter-spacing:-.01em}
.race .cd small{font-size:13px;text-transform:uppercase;letter-spacing:.08em;margin-left:6px}
.phasebar{height:4px;gap:2px;margin:14px 0 8px}
.phasebar i{border-radius:2px;background:rgba(255,255,255,.14)}
.race .grid{gap:0;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1)}
.race .grid>div{padding-left:12px;border-left:1px solid rgba(255,255,255,.1)}
.race .grid>div:first-child{padding-left:0;border-left:0}
.race .grid .v{font-size:20px}
/* tuiles et bandeaux de stats */
.tiles{gap:8px}
.tile{padding:12px}
.tile .v{font-size:24px;margin-top:4px}
.tile .v small{font-size:13px}
.tile .s{font-size:12.5px;margin-top:2px;font-weight:600}
.card .tiles .tile{padding:0 0 0 12px;border-left:1px solid var(--line)}
.card .tiles .tile:first-child{padding-left:0;border-left:0}
/* séances */
.sess{gap:12px}
.sess .bar{width:3px}
.tagt{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.tagt i{width:7px;height:7px;border-radius:50%}
.sess h3{font-size:16px;margin-top:4px!important}
.meta{font-size:13.5px;gap:2px 12px}
.note{background:none;border:0;border-left:2px solid var(--line);border-radius:0;padding:2px 0 2px 10px;margin-top:10px;font-size:14px}
.det{font-size:14px}
.st{font-size:11px;text-transform:uppercase;letter-spacing:.05em;border-radius:5px;padding:3px 7px}
.sess.done{background:color-mix(in srgb,var(--good) 7%,var(--surface))}
.dayh{margin:18px 2px 6px}
/* plan */
.phases{gap:2px;margin-top:10px}
.phases button{height:22px;border-radius:4px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;opacity:.9}
.weeks{gap:5px;margin-top:10px}
.wk{border-radius:8px;padding:5px 8px;min-width:46px}
.wk .n{font-size:14px}.wk .km{font-size:11px}
.wk.on{border:1.5px solid var(--accent);background:var(--accent-soft)}
.wk i{height:2px;margin-top:3px}
/* formulaires */
.inp{border-radius:8px;padding:10px 11px;font-size:15.5px}
.seg{gap:5px}
.seg button{border-radius:7px;padding:7px 11px;font-size:13.5px}
.scale button{border-radius:6px;padding:7px 0;font-size:13px}
.sheet{border-radius:16px 16px 0 0}
@media (min-width:640px){.sheet{border-radius:16px}}
/* divers */
.prog{height:6px;border-radius:3px;border:0;background:var(--line2)}
.prog i{border-radius:3px}
.alert,.info{border-radius:10px;font-size:14px;padding:11px 13px}
.jr{padding:9px 0;border-top-color:var(--line2)}
.jr .sq{width:32px;height:32px;border-radius:8px;font-size:11.5px}
.tbl{font-size:14px}.tbl td{border-top-color:var(--line2);padding:7px 0}

.app .card{margin-left:-16px;margin-right:-16px;border-radius:0;border-left:0;border-right:0;padding:16px}

.app .card+.card{margin-top:0;border-top:0}

.race{margin:0 -16px;border-radius:0;border:0;padding:18px 16px 16px}

.tagt{text-transform:none;letter-spacing:0;font-size:13px;font-weight:700}
.tagt i{display:none}
.st{text-transform:none;letter-spacing:0;font-size:12px}
.note .h,.cmp .h,.dayh{text-transform:none;letter-spacing:0;font-size:13px}
.dayh{margin:var(--gap) -16px 0;padding:10px 16px 6px;color:var(--muted);font-weight:600}

<body>
<main class="app" id="app"></main>
<button class="fab" id="fab" aria-label="Saisir une activité" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Séance</button>
<nav class="tabs" id="tabs"><div class="in"></div></nav>
<div id="layer"></div>
<script type="application/json" id="seed">{"profile": {"prenom": "Paul", "fcMax": "208", "fcRepos": "52", "theme": "auto"}, "objectifs": [{"id": "semi-paris", "titre": "Semi-marathon de Paris", "distKm": 21.0975, "date": "2027-03-07", "cibleSec": null, "priorite": "A"}]}</script>
<script>
/* ====== MOTEUR : niveau (VDOT), allures, plan, adaptation, indicateurs ====== */
const pad2 = n => String(n).padStart(2, "0");
const isoD = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addD = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return isoD(d); };
const mondayOf = s => { const d = parseD(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return isoD(d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const r1 = x => Math.round(x * 10) / 10;
const r05 = x => Math.round(x * 2) / 2;

/* --- Daniels-Gilbert --- */
const vo2 = v => -4.6 + 0.182258 * v + 0.000104 * v * v;
const pctMax = t => 0.8 + 0.1894393 * Math.exp(-0.012778 * t) + 0.2989558 * Math.exp(-0.1932605 * t);
function vdotFrom(m, sec) { const t = sec / 60; return vo2(m / t) / pctMax(t); }
function velAt(v) { const a = 0.000104, b = 0.182258, c = -(4.6 + v); return (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a); }
function predictSec(vdot, m) { let lo = m / 1000 * 100, hi = m / 1000 * 1200; for (let i = 0; i < 70; i++) { const mid = (lo + hi) / 2; if (vdotFrom(m, mid) > vdot) lo = mid; else hi = mid; } return (lo + hi) / 2; }
function paces(vdot) {
  const sk = f => 60000 / velAt(f * vdot);
  const I = sk(0.98);
  return { vmaKmh: velAt(vdot) * 0.06, E: [sk(0.70), sk(0.62)], T: sk(0.88), I, R: I - 15, HM: predictSec(vdot, 21097.5) / 21.0975, M: predictSec(vdot, 42195) / 42.195, K10: predictSec(vdot, 10000) / 10, K5: predictSec(vdot, 5000) / 5 };
}
const fmtPace = s => `${Math.floor(s / 60)}’${pad2(Math.round(s % 60) % 60)}`;
const fmtTime = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}h${pad2(m)}’${pad2(x)}` : `${m}’${pad2(x)}`; };

/* --- Paramètres par distance --- */
const DIST = {
  5: { label: "5 km", taper: [0.6], lrMax: 14, peak: { 2: 25, 3: 32, 4: 40, 5: 48, 6: 55 } },
  10: { label: "10 km", taper: [0.6], lrMax: 16, peak: { 2: 28, 3: 36, 4: 45, 5: 55, 6: 62 } },
  21.1: { label: "Semi-marathon", taper: [0.7, 0.5], lrMax: 19, peak: { 2: 30, 3: 38, 4: 52, 5: 62, 6: 70 } },
  42.2: { label: "Marathon", taper: [0.75, 0.6, 0.45], lrMax: 32, peak: { 2: 40, 3: 52, 4: 62, 5: 75, 6: 88 } }
};
const distKey = km => km <= 6 ? 5 : km <= 12 ? 10 : km <= 30 ? 21.1 : 42.2;

/* --- Squelette : phases, semaines allégées, affûtage --- */
/* Répartition des phases : système de priorité de Daniels (Daniels' Running Formula, fig. « priority numbering »).
   Les semaines disponibles sont distribuées dans l'ordre de priorité ci-dessous entre ses 4 phases :
   I fondation, II qualité initiale, III qualité de transition, IV qualité finale.
   Correspondance dans l'appli : I = Base, II = Développement, III + IV (hors affûtage) = Spécifique, fin de IV = Affûtage. */
const DANIELS_PRIO = { I: [1, 2, 3, 13, 21, 23], II: [10, 11, 12, 18, 19, 20], III: [7, 8, 9, 14, 15, 16], IV: [4, 5, 6, 17, 22, 24] };
function danielsSplit(n, keepBase, dk) {
  const cnt = k => DANIELS_PRIO[k].filter(x => x <= Math.min(n, 24)).length;
  let I = cnt("I"), II = cnt("II"), III = cnt("III"), IV = cnt("IV");
  if (n > 24) I += n - 24;                         // au-delà de 24 semaines : plus de fondation
  // Daniels : la phase I peut être réduite si le coureur a déjà une bonne base ; les semaines libérées vont à II et III.
  // Semaines libérées : semi/marathon → d'abord la phase finale (spécifique) puis la qualité ; 5/10 km → qualité puis vitesse.
  if (keepBase != null && I > keepBase) { let x = I - keepBase; I = keepBase; const order = (dk || 21) >= 15 ? ["IV", "III"] : ["III", "II"]; let k = 0;
    while (x > 0) { if (order[k % 2] === "IV") IV++; else if (order[k % 2] === "III") III++; else II++; x--; k++; } }
  return { I, II, III, IV };
}
function skeleton(startWs, raceDate, distKm, opt) {
  opt = opt || {};
  const raceWs = mondayOf(raceDate), D = DIST[distKey(distKm)];
  const weeks = []; for (let w = startWs; w <= raceWs && weeks.length < 52; w = addD(w, 7)) weeks.push(w);
  const N = weeks.length, T = Math.min(D.taper.length, Math.max(1, N - 1));
  const rec = opt.recovWeek && N - T >= 6 ? 1 : 0;
  const keep = { reprise: null, entretien: 3, forme: 2, prepa: 1 }[opt.status || "reprise"];
  const sp = danielsSplit(N - rec, keep, distKey(distKm));
  const base = sp.I, dev = sp.II, qual = sp.III, spe = Math.max(0, sp.IV - T), B = base + dev + qual + spe;
  const every = opt.deloadEvery || 0;
  let streak = 0;
  return weeks.map((ws, j) => {
    const i = j - rec;
    if (j < rec) return { ws, n: j + 1, N, phase: "Base", sub: "Fondation", kind: "recov", pw: 0, pLen: 1, taperIdx: -1, test: false };
    const sub = i < base ? "Fondation" : i < base + dev ? "Vitesse" : i < base + dev + qual ? "Qualité" : i < B ? "Spécifique" : "Affûtage";
    // Phases affichées : Base = fondation + vitesse (Daniels I + II), Développement = qualité (III), Spécifique (IV), Affûtage.
    const phase = { Fondation: "Base", Vitesse: "Base", "Qualité": "Développement", "Spécifique": "Spécifique", "Affûtage": "Affûtage" }[sub];
    let kind = "build";
    if (i >= B) kind = j === N - 1 ? "race" : "taper";
    else { streak++; if (every && streak === every && i < B - 1) { kind = "deload"; streak = 0; } }
    const starts = { Fondation: 0, Vitesse: base, "Qualité": base + dev, "Spécifique": base + dev + qual, "Affûtage": B };
    const lens = { Fondation: base, Vitesse: dev, "Qualité": qual, "Spécifique": spe, "Affûtage": T };
    const pStart = starts[sub], pLen = lens[sub];
    return { ws, n: j + 1, N, phase, sub, kind, pw: i - pStart, pLen, taperIdx: i - B, test: false };
  });
}

/* --- Placement des jours --- */
function pickDays(avail, lrDay, nQ, nE) {
  const days = avail.filter(d => d !== lrDay).sort((a, b) => a - b);
  const gap = (a, b) => { const d = Math.abs(a - b); return Math.min(d, 7 - d); };
  let best = null;
  const combos = (arr, k, start = 0, cur = []) => { if (cur.length === k) { const hard = [lrDay, ...cur]; let mg = 9; for (let i = 0; i < hard.length; i++) for (let j = i + 1; j < hard.length; j++) mg = Math.min(mg, gap(hard[i], hard[j])); if (!best || mg > best.mg) best = { mg, q: cur.slice() }; return; } for (let i = start; i < arr.length; i++) { cur.push(arr[i]); combos(arr, k, i + 1, cur); cur.pop(); } };
  combos(days, Math.min(nQ, days.length));
  const q = best ? best.q : [];
  const rest = days.filter(d => !q.includes(d)).sort((a, b) => (gap(b, lrDay) + (q.length ? Math.min(...q.map(x => gap(b, x))) : 0)) - (gap(a, lrDay) + (q.length ? Math.min(...q.map(x => gap(a, x))) : 0)));
  return { q, e: rest.slice(0, nE).sort((a, b) => a - b) };
}

/* --- Bibliothèque de séances --- */
const WU = 2.5, CD = 2;
function sess(type, titre, km, P, details, mot, extra = {}) {
  const pace = { E: P.E[0] + 15, LR: P.E[0] + 20, T: P.T, I: P.I, R: P.R, HM: P.HM, M: P.M, X: P.E[0], REC: P.E[1], TEST: P.K10, RACE: P.HM }[type] || P.E[0];
  const easyShare = ["E", "LR", "REC", "X"].includes(type) ? 1 : 0.6;
  const dur = km * (easyShare * (P.E[0] + 15) + (1 - easyShare) * pace) / 60;
  return { type, titre, km: r05(km), durMin: Math.round(dur), details, mot, ...extra };
}
const eRange = P => `${fmtPace(P.E[0])}–${fmtPace(P.E[1])}/km`;
function qualSession(kind, vol, P, prog, ctx) {
  const ramp = 0.75 + 0.25 * prog;
  if (kind === "LD") return sess("E", "Footing + lignes droites", 0, P, `Footing en endurance, puis 6 à 8 lignes droites de 20 s en accélération progressive (retour en marchant). 5 min de retour au calme.`, `Footing facile ; les lignes droites travaillent la foulée, pas le souffle : rapides et relâchées, jamais à fond.`, { light: true });
  return libSession(kind, vol, P, prog, ctx);
}

/* ====== BIBLIOTHÈQUE DE SÉANCES (multi-sources) ======
   Chaque famille progresse par paliers. Le palier dépend de l'avancement dans la phase, du retour des séances
   précédentes (ajustement séance par séance) et d'un plafond de dose :
   - Seuil : cruise intervals de Daniels → tempo continu de Pfitzinger (20–40 min). Plafond : max(10 % du volume, 16→28 min).
   - VMA : 30/30 de Billat (2000) → 60/30 (Millet 2003) → fractions de 400 à 1000 m (Daniels). Plafond : max(8 %, 3→5 km).
   - Vitesse : répétitions de Daniels. Côtes : sprints en côte de Pfitzinger. Fartlek : usage d'entraîneur.
   - Allure semi : blocs puis continu (Pfitzinger, Hanson). Plafond : max(15 %, 4→8 km). */
const LIB = {
  T: { src: "Daniels (cruise intervals) · Pfitzinger (tempo)", steps: [{ n: 3, min: 8, rec: 60 }, { n: 3, min: 10, rec: 60 }, { n: 2, min: 12, rec: 120 }, { n: 2, min: 15, rec: 120 }, { n: 1, min: 20 }, { n: 3, min: 12, rec: 90 }, { n: 1, min: 25 }, { n: 2, min: 18, rec: 120 }] },
  I: { src: "Billat 2000 (30/30) · Millet 2003 (60/30) · Daniels (intervalles)", steps: [{ sets: 2, n: 8, on: 30, off: 30, pct: 1.0 }, { sets: 2, n: 10, on: 30, off: 30, pct: 1.0 }, { sets: 2, n: 6, on: 60, off: 30, pct: 0.98 }, { dist: 400, n: 10, pct: 1.0 }, { dist: 600, n: 8, pct: 0.98 }, { dist: 800, n: 6, pct: 0.97 }, { dist: 1000, n: 5, pct: 0.95 }] },
  R: { src: "Daniels (répétitions)", steps: [{ dist: 200, n: 8 }, { dist: 200, n: 10 }, { dist: 300, n: 6 }, { dist: 300, n: 8 }, { dist: 400, n: 6 }] },
  COTES: { src: "Pfitzinger (sprints en côte) · Daniels", steps: [{ sec: 30, n: 8 }, { sec: 30, n: 10 }, { sec: 45, n: 6 }, { sec: 45, n: 8 }] },
  FARTLEK: { src: "Méthode suédoise du fartlek, usage d’entraîneur", steps: [{ on: 60, off: 60, n: 8 }, { on: 60, off: 60, n: 10 }, { on: 120, off: 60, n: 6 }, { on: 120, off: 60, n: 8 }] },
  HM: { src: "Pfitzinger · Hanson (allure spécifique semi)", steps: [{ n: 3, km: 2, rec: 120 }, { n: 3, km: 3, rec: 120 }, { n: 2, km: 4, rec: 150 }, { n: 2, km: 5, rec: 180 }, { n: 1, km: 8 }, { n: 1, km: 10 }] },
  M: { src: "Pfitzinger · Daniels (allure marathon)", steps: [{ n: 1, km: 8 }, { n: 1, km: 12 }, { n: 2, km: 8, rec: 180 }, { n: 1, km: 16 }, { n: 1, km: 20 }] }
};
function vmaPace(P, ctx, pct) { const kmh = ctx.vma || P.vmaKmh; return 3600 / (kmh * pct); }
function workKmOf(kind, st, P, ctx) {
  if (kind === "T") return st.n * st.min * 60 / P.T;
  if (kind === "I") return st.dist ? st.n * st.dist / 1000 : st.sets * st.n * st.on / vmaPace(P, ctx, st.pct);
  if (kind === "R") return st.n * st.dist / 1000;
  if (kind === "HM" || kind === "M") return st.n * st.km;
  return 0;
}
function capKm(kind, vol, prog, P) {
  if (kind === "T") return Math.max(0.10 * vol, (16 + 12 * prog) * 60 / P.T);
  if (kind === "I") return Math.max(0.08 * vol, 3 + 2 * prog);

    const rf = ret[i - fromIdx]; if (rf) vol *= rf;
    const toTaper = sk.findIndex(x => x.kind === "taper" || x.kind === "race") - i;
    const peakLR = dk === 21.1 && w.phase === "Spécifique" && w.kind === "build" && (toTaper === 2 || toTaper === 3) ? (runs <= 3 ? (toTaper === 3 ? 16 : 17) : (toTaper === 3 ? 17 : 18)) : 0;
    const floorLR = ["build", "race"].includes(w.kind) && !w.test ? Math.min(lrMax, D.lrMax) : 0;   // ne pas redescendre sous ta plus longue récente
    let lr = Math.min(Math.max(frac * vol, peakLR, floorLR), D.lrMax, lrMax * (prm.lrStepEff || prm.lrStep || 1.10), 150 * 60 / (P.E[0] + 20));
    lr = Math.max(lr, Math.min(6, vol * 0.4));
    if (w.kind === "deload" || w.kind === "recov") lr = Math.min(lr, lrMax * (w.kind === "recov" ? 0.7 : 0.8));
    if (w.kind === "taper") lr = Math.min(lr, lrMax * (w.taperIdx === 0 ? 0.75 : 0.6));
    lr = r05(lr);
    if (w.kind === "build" && !w.test) lrMax = Math.max(lrMax, lr);
    const bprm = { ...prm, painHold: (i === fromIdx && opts.painHold) || !!rf, famCount: { ...famCount } };
    let s = buildWeek(w, vol, lr, P, bprm);
    for (let pass = 0; pass < 4; pass++) { const real = s.reduce((a, x) => a + x.km, 0); if (real < vol - 0.25) { vol = real; s = buildWeek(w, vol, lr, P, bprm); } else break; }
    // créneaux disponibles (profil) : footings ≤ séance max en semaine, sortie longue ≤ durée max du week-end
    s.forEach(x => {
      const cap = x.type === "LR" ? prm.capWE : x.type === "E" ? prm.capWeek : null;
      if (cap && x.durMin > cap) { const f = cap / x.durMin; x.km = r05(x.km * f); x.durMin = Math.round(x.durMin * f); }
      else if (prm.capWeek && ["T", "I", "R", "HM", "M", "X"].includes(x.type) && x.durMin > prm.capWeek) x.mot += " Elle dépasse ton créneau de semaine : place-la un jour où tu as plus de temps.";
    });
    s.forEach((x, k) => { x.id = `${w.ws}-${k}`; x.ws = w.ws; x.ord = k; x.statut = "prevu"; });
    if (prm.muscu) s.forEach(x => { if (x.key && !x.race) x.details += " Pas de musculation des jambes la veille."; });
    s.forEach(x => { if (x.fam) famCount[x.fam] = (famCount[x.fam] || 0) + 1; });
    setPriorities(s);
    weeks.push({ ...w, volKm: r1(s.reduce((a, x) => a + x.km, 0)), sessions: s });
  }
  return { weeks, peak: r1(peak), skeleton: sk };
}

/* --- Indicateurs --- */
function trimp(a, fcMax, fcRepos) {
  const dur = a.dureeMin || 0; if (!dur) return 0;
  let hrr;
  if (a.fcMoy && fcMax && fcRepos && fcMax > fcRepos) hrr = clamp((a.fcMoy - fcRepos) / (fcMax - fcRepos), 0, 1);
  else hrr = clamp(0.35 + 0.05 * (a.rpe || 5), 0.4, 0.9);
  return dur * hrr * 0.64 * Math.exp(1.92 * hrr);
}
function pmc(acts, fcMax, fcRepos, endDate, days) {
  const byDay = {}; acts.forEach(a => { byDay[a.date] = (byDay[a.date] || 0) + trimp(a, fcMax, fcRepos); });
  const first = acts.length ? acts.reduce((m, a) => a.date < m ? a.date : m, endDate) : endDate;
  const start = addD(first, -1);
  let ctl = 0, atl = 0; const out = [];
  const kC = 1 - Math.exp(-1 / 42), kA = 1 - Math.exp(-1 / 7);
  for (let d = start; d <= endDate; d = addD(d, 1)) {
    const l = byDay[d] || 0; ctl += (l - ctl) * kC; atl += (l - atl) * kA;
    out.push({ date: d, ctl, atl, tsb: ctl - atl });
  }
  return out.slice(-days);
}

/* ====== PLANS TYPES (source : plans-types.xlsx) ======
   Le plan n'est plus généré : il est repris tel quel du tableur validé, calé en remontant depuis la date de course.
   L'algorithme décide uniquement des allures (règles strictes par zone) et des estimations de chrono. */
const TPL = (() => { const S = TPL_DATA.s, P = {}; for (const [k, v] of Object.entries(TPL_DATA.p)) P[k] = { ...v, rows: v.rows.map(r => ({ week: r[0], phase: S[r[1]], kind: S[r[2]], fam: S[r[3]], type: S[r[4]], content: S[r[5]], zone: S[r[6]], mins: r[7], util: S[r[8]], cont: S[r[9]], key: S[r[10]] })) }; return P; })();
const TPL_DK = km => km < 7 ? "5K" : km < 15 ? "10K" : km < 30 ? "SEMI" : "MARA";
const TPL_DUR = { "5K": [8, 10, 12], "10K": [8, 10, 12], "SEMI": [10, 12, 16], "MARA": [16, 20] };
const TPL_RUNS = dk => dk === "MARA" ? [4, 5] : [3, 4, 5];
const TPL_KIND = { "Charge": "build", "Allègement": "deload", "Affûtage": "taper", "Course": "race" };
const TPL_TYPE = { EF: "E", MOY: "E", SL: "LR", COTES: "X", FART: "X", VMAC: "I", VMAL: "I", S30: "T", S60: "T", AS: "HM", TQ: "HM", RAP: "HM", RACE: "RACE" };
const TPL_PRIO = f => f === "RACE" ? 0 : f === "SL" ? 2 : f === "AS" || f === "TQ" || f === "RAP" ? 3 : ["S60", "S30", "VMAL"].includes(f) ? 4 : ["VMAC", "COTES", "FART"].includes(f) ? 5 : f === "MOY" ? 6 : 7;

// Durées de plan possibles avant la course (le plan démarre à la date de course moins sa durée, jamais avant cette semaine)
function tplOptions(distKm, raceDate) {
  const dk = TPL_DK(distKm), cur = mondayOf(today()), raceWs = mondayOf(raceDate);
  return TPL_DUR[dk].map(W => ({ W, start: addD(raceWs, -7 * (W - 1)) })).map(o => ({ ...o, ok: o.start >= cur, wait: Math.max(0, daysBetween(cur, o.start) / 7) }));
}

function vmaKmhOf(vdot) { const pr = num(S.profile.vma); return pr || velAt(vdot) * 0.06; }

  $("#app").innerHTML = r === "seance" ? vSession(decodeURIComponent(location.hash.slice(8))) : r === "reglages" ? vReglages() : { accueil: vHome, plan: vPlan, stats: vStats, profil: vProfil }[r]();
}
const typeTag = s => `<span class="tagt"><i style="background:${(TYPES[s.type] || TYPES.E).c}"></i>${(TYPES[s.type] || TYPES.E).n}</span>`;
function stBadge(s) {
  if (s.statut === "fait") { const a = S.acts.find(x => x.id === s.actId); return `<span class="st st-ok">Validée${a ? " · " + fShort(a.date) : ""}</span>`; }
  if (s.statut === "saute") return `<span class="st st-skip">Sautée</span>`;
  if (s.ws && weekDone(s.ws)) return `<span class="st st-miss">Non réalisée</span>`;
  return "";
}

function sessCard(s, opts = {}) {
  const a = s.actId ? S.acts.find(x => x.id === s.actId) : null, done = s.statut === "fait";
  return `<div class="card sess tap ${done ? "done" : ""} ${s.statut === "saute" ? "skipped" : ""}" data-a="open" data-id="${s.id}" role="link" tabindex="0" aria-label="Voir le détail : ${esc(s.titre)}"><div class="band band-${FAM[s.type] || "w"}"><span class="bn">S${(s.ord ?? 0) + 1}</span></div><div class="grow">
    <div class="row between" style="align-items:flex-start;gap:8px"><h3>${esc(s.titre)}</h3>${done ? "" : stBadge(s) || (s.prio ? `<span class="prio">Priorité ${s.prio}</span>` : "")}</div>
    <div class="meta"><span><b class="num">${s.km}</b> km</span><span>≈ <b class="num">${fDur(s.durMin)}</b></span>${s.date ? `<span>${fDay(s.date)}</span>` : ""}</div>
    ${a ? `<div class="meta" style="margin-top:6px"><span>Réalisé : <b class="num">${a.distanceKm ?? "–"} km</b> en <b class="num">${fDur(a.dureeMin)}</b> · ${paceOf(a.distanceKm, a.dureeMin)}</span></div>` : `<div class="note"><span class="h">Mot du coach</span>${esc(s.mot)}</div>`}
    <div class="row between" style="margin-top:12px"><span class="link" style="font-size:14px;display:inline-flex;align-items:center;gap:2px">Voir<span class="lg">&nbsp;la séance</span> ${I.right.replace("<svg", '<svg width="16" height="16"')}</span>${done ? `<span class="btn btn-ok" data-a="editact" data-id="${s.actId}">${I.check}Validée${a ? " le " + fShort(a.date) : ""}</span>` : s.statut === "saute" ? `<button class="btn btn-o btn-sm" data-a="skip" data-id="${s.id}">Annuler « sautée »</button>` : `<button class="btn btn-p btn-sm" data-a="log" data-id="${s.id}">Valider la séance</button>`}</div>
  </div></div>`;
}

/* --- Accueil --- */
function vHome() {
  const t = today(), p = S.plan, o = objA();
  if (p) snapshotProjection();
  const head = `<div class="top"><div><div class="eyebrow">${fDay(t).replace(/^./, c => c.toUpperCase())}</div><h1>${S.profile.prenom ? "Bonjour " + esc(S.profile.prenom) : "Bonjour"}</h1></div><button class="iconbtn" data-a="coach" aria-label="Demander à Claude">${I.msg}</button></div>`;
  const active = p && p.prm.raceDate >= t;
  if (!active) {
    const ended = p && p.prm.raceDate < t;
    return head + `<div class="race"><div class="lbl">${ended ? "Plan terminé · " + esc(p.prm.raceName) : "Prochain objectif"}</div><h2>${o ? esc(o.titre) : "Aucun plan en cours"}</h2><p style="color:var(--hero-muted);margin-top:8px;font-size:15px">${o ? `Le questionnaire mesure ton niveau, ton volume actuel et ta disponibilité, puis l’algorithme construit ton plan jusqu’au ${fDate(o.date)}.` : "Ajoute un objectif principal pour construire ton plan."}</p><button class="btn btn-p btn-b" style="margin-top:16px" data-a="${o ? "quiz" : "objadd"}" data-id="${o ? o.id : ""}">${o ? "Construire mon plan" : "Ajouter un objectif"}</button></div>` + weekKpi() + objList();
  }
  const inten = intensity(), ef = efficiency(), pm = pmc(S.acts, fc().max, fc().rep, t, 1)[0];
  const avg = a => a.reduce((s, x) => s + x.ef, 0) / a.length;
  const efNow = ef.slice(-3), efOld = ef.filter(x => x.date <= addD(t, -28)).slice(-3);
  const efDelta = efNow.length && efOld.length ? (avg(efNow) / avg(efOld) - 1) * 100 : null;
  const tsb = pm ? pm.tsb : null;
  const tsbTxt = tsb == null ? ["Pas de données", ""] : tsb < -25 ? ["Fatigue élevée", "bad"] : tsb < -10 ? ["Charge productive", "good"] : tsb < 5 ? ["Équilibre", ""] : ["Frais", "good"];
  const pr = projection();
  return head + raceCard() + homeAlerts() + weekKpi() + `
  <div class="sec"><div class="sec-h"><h2>Indicateurs</h2><a class="link" href="#stats">Analyse</a></div><div class="tiles">
    <div class="card tile"><div class="k">${o?.cibleSec ? "Écart à ta cible" : "Fourchette jour J"}</div><div class="v num">${o?.cibleSec ? (pr.race <= o.cibleSec ? "−" : "+") + fmtTime(Math.abs(pr.race - o.cibleSec)) : fmtTime(pr.race)}</div><div class="s ${o?.cibleSec ? (pr.race <= o.cibleSec ? "good" : "warn") : "muted"}">${o?.cibleSec ? (pr.race <= o.cibleSec ? "en avance sur " : "en retard sur ") + fmtTime(o.cibleSec) : fmtTime(pr.lo) + " – " + fmtTime(pr.hi)}</div></div>
    <div class="card tile"><div class="k">Fraîcheur</div><div class="v num">${tsb == null ? "–" : (tsb > 0 ? "+" : "") + Math.round(tsb)}</div><div class="s ${tsbTxt[1]}">${tsbTxt[0]}</div></div>
    <div class="card tile"><div class="k">Facile / dur (4 sem.)</div><div class="v num">${inten ? Math.round(inten.easy * 100) : "–"}<small> %</small></div><div class="s ${inten ? (inten.easy >= 0.78 ? "good" : "warn") : "muted"}">${inten ? (inten.easy >= 0.78 ? "Dans la cible : 80 % facile" : "Trop d’intensité") : "Pas de données"}</div></div>
    <div class="card tile"><div class="k">Rendement cardio</div><div class="v num">${ef.length ? avg(ef.slice(-3)).toFixed(2) : "–"}<small> m/battement</small></div><div class="s ${efDelta == null ? "muted" : efDelta >= 0 ? "good" : "warn"}">${efDelta == null ? "Saisis ta fréquence cardiaque" : (efDelta >= 0 ? "+" : "") + efDelta.toFixed(1) + " % sur 4 semaines"}</div></div>
  </div></div>` + objList();
}

function raceCard() {
  const p = S.plan, o = objA(), t = today(); if (!p) return "";
  const j = daysBetween(t, p.prm.raceDate), cur = mondayOf(t), w = weekOf(cur) || p.weeks[0];
  const sk = p.weeks;
  const phases = []; sk.forEach(x => { const l = phases[phases.length - 1]; if (l && l.n === x.phase) l.c++; else phases.push({ n: x.phase, c: 1, start: x.ws }); });
  const idx = sk.findIndex(x => x.ws === cur);
  const comp = compliance();
  const pr = projection();
  let acc = 0;
  const nextPh = (() => { let a2 = 0; for (const ph of phases) { if (a2 > idx) return ph; a2 += ph.c; } return null; })();
  return `<div class="race"><div class="lbl">Objectif · ${fDate(p.prm.raceDate)}</div><h2>${esc(p.prm.raceName)}</h2>
  <div class="cd num" style="margin-top:12px">${Math.max(0, j)}<small>jours</small></div>
  <div class="phasebar">${phases.map(ph => { const fill = clamp((idx + 1 - acc) / ph.c, 0, 1); acc += ph.c; return `<i style="flex:${ph.c}"><b style="width:${fill * 100}%;opacity:${fill ? 1 : 0}"></b></i>`; }).join("")}</div>
  ${idx < 0 && cur < sk[0].ws ? `<div style="font-size:13.5px"><b>Plan de ${sk.length} semaines · démarre le ${fDate(sk[0].ws)}</b><br><span style="color:var(--hero-muted)">D’ici là, cours librement, sans plan.</span></div>` : ""}
  <div class="row between" style="font-size:13.5px;${idx < 0 && cur < sk[0].ws ? "display:none" : ""}"><span><b>Semaine ${Math.max(1, idx + 1)}/${sk.length}</b> <span style="color:var(--hero-muted)">· ${esc(w.phase)}</span></span><span style="color:var(--hero-muted)">${nextPh ? esc(nextPh.n) + " le " + fShort(nextPh.start) : ""}</span></div>
  <div class="grid"><div><div class="v num">${fmtTime(pr.now)}</div><div class="k">Aujourd’hui</div></div>
  <div><div class="v num">${fmtTime(pr.race)}</div><div class="k">Visé jour J</div>${o?.cibleSec ? `<div style="font-size:12px;color:var(--hero-muted);margin-top:1px">cible ${fmtTime(o.cibleSec)}</div>` : ""}</div>
  <div><div class="v num">${comp ? comp.keyDone + "/" + comp.keyTot : "–"}</div><div class="k">Séances clés</div></div></div></div>`;
}
function homeAlerts() {
  const t = today(), out = [];
  const pain = painRecent();
  if (pain.length) out.push(`<div class="alert"><b>Douleur signalée</b> le ${fShort(pain[0].date)}${typeof pain[0].douleur === "string" ? " (" + esc(pain[0].douleur) + ")" : ""}. Le prochain recalcul retire l’intensité. Si elle persiste plus de quelques jours, consulte un professionnel.</div>`);
  const cw = mondayOf(t), nextLR = allSessions().find(s => s.ws >= cw && s.type === "LR" && s.statut !== "fait");
  const l30 = refLongest(addD(t, 1));
  if (nextLR && l30 && nextLR.km > l30 * 1.1) out.push(`<div class="alert"><b>Sortie longue en hausse de ${Math.round(100 * (nextLR.km / l30 - 1))} %</b> par rapport à ta plus longue des 30 derniers jours (${l30} km). Au-delà de 10 %, le risque de blessure augmente : raccourcis-la à ${r05(l30 * 1.1)} km.</div>`);
  const last = weekOf(addD(cw, -7));
  const missed = last ? last.sessions.filter(s => s.key && s.statut === "prevu") : [];
  if (missed.length) out.push(`<div class="info">${missed.length} séance${missed.length > 1 ? "s" : ""} clé${missed.length > 1 ? "s" : ""} non réalisée${missed.length > 1 ? "s" : ""} la semaine dernière. Le recalcul du lundi en a tenu compte.</div>`);
  return out.join("");
}

function weekKpi() {
  const t = today(), ws = mondayOf(t), cur = actsBetween(ws, addD(ws, 6)), prev = actsBetween(addD(ws, -7), addD(ws, -1));
  const k = arr => ({ n: arr.length, km: runKm(arr), min: arr.reduce((s, a) => s + (a.dureeMin || 0), 0) });
  const a = k(cur), b = k(prev), w = weekOf(ws), rv = weekReview(ws);
  const d = (x, y, f) => `<div class="s muted" style="font-weight:500">${y ? "S-1 " + f(y) : "S-1 —"}</div>`;
  return `<div class="sec"><div class="sec-h"><h2>Ma semaine</h2><span class="muted small">${fShort(ws)} – ${fShort(addD(ws, 6))}</span></div>
  <div class="card"><div class="tiles" style="grid-template-columns:repeat(3,1fr);gap:8px">
    <div class="tile"><div class="k">Activités</div><div class="v num">${a.n}</div>${d(a.n, b.n, String)}</div>
    <div class="tile"><div class="k">Kilomètres</div><div class="v num">${r1(a.km)}</div>${d(a.km, b.km, x => r1(x) + " km")}</div>
    <div class="tile"><div class="k">Temps</div><div class="v num">${fDur(a.min)}</div>${d(a.min, b.min, fDur)}</div></div>
    ${w ? `<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line2)"><div class="row between"><span class="eyebrow">Plan · semaine ${w.n}${w.kind === "deload" ? " · allégée" : ""}</span><span class="small"><b class="num">${rv.valid}/${rv.tot}</b> séances · <b class="num">${r1(rv.done)}/${w.volKm}</b> km</span></div></div><div class="prog" style="margin-top:8px"><i style="width:${Math.min(100, 100 * rv.done / (w.volKm || 1))}%"></i></div>` : ""}
  </div></div>`;
}

function journalTail() {
  const j = S.plan?.journal?.[0]; return j ? `<div class="sec"><div class="info"><b>Dernier ajustement du plan</b> · ${fShort(j.date)}<br>${esc(j.msg)}</div></div>` : "";
}

/* --- Plan --- */
let planWs = null;
function vPlan() {
  const p = S.plan;
  if (!p) return `<div class="top"><h1>Plan</h1></div><div class="card empty sec"><h3>Pas encore de plan</h3><p>Ajoute un objectif principal depuis l’accueil et réponds au questionnaire.</p><button class="btn btn-p" data-a="${objA() ? "quiz" : "objadd"}" data-id="${objA()?.id || ""}">Commencer</button></div>`;
  const t = today(), cur = mondayOf(t);
  if (!planWs || !weekOf(planWs)) planWs = weekOf(cur) ? cur : (cur < p.weeks[0].ws ? p.weeks[0].ws : p.weeks[p.weeks.length - 1].ws);
  const w = weekOf(planWs), rv = weekReview(planWs);
  const sk = p.weeks, waiting = cur < p.weeks[0].ws;
  const phases = []; sk.forEach(x => { const l = phases[phases.length - 1]; if (l && l.n === x.phase) l.c++; else phases.push({ n: x.phase, c: 1, ws: x.ws }); });
  const PC = { "Fondation": "var(--b-e)", "Vitesse": "var(--c-X)", "Qualité": "var(--b-w)", "Spécifique": "var(--c-HM)", "Affûtage": "var(--b-l)", "Base": "var(--b-e)", "Développement": "var(--b-w)" };
  const sess = w.sessions.slice().sort((a, b) => a.ord - b.ord);
  const extra = actsBetween(planWs, addD(planWs, 6)).filter(a => !w.sessions.some(s => s.actId === a.id));
  return `<div class="top"><div><div class="eyebrow">${esc(p.prm.raceName)} · ${fDate(p.prm.raceDate)}</div><h1>Plan</h1></div></div>
  ${waiting ? `<div class="info"><b>Ton plan démarre le ${fDate(p.weeks[0].ws)}</b> (dans ${Math.max(1, Math.round(daysBetween(today(), p.weeks[0].ws) / 7))} semaine${Math.round(daysBetween(today(), p.weeks[0].ws) / 7) > 1 ? "s" : ""}). D’ici là, cours librement : tu peux déjà consulter les séances.</div>` : ""}
  <div class="phases">${phases.map(ph => `<button style="flex:${ph.c};background:${PC[ph.n]}" data-a="gows" data-ws="${ph.ws}">${esc(ph.n)}</button>`).join("")}</div>
  <div class="weeks" id="wks">${p.weeks.map(x => `<button class="wk ${x.ws === planWs ? "on" : ""} ${x.ws === cur ? "cur" : ""}" data-a="gows" data-ws="${x.ws}"><div class="n num">S${x.n}</div><div class="km num">${x.volKm} km</div><i style="background:${PC[x.phase]};opacity:${x.kind === "deload" ? .35 : 1}"></i></button>`).join("")}</div>
  <div class="card" style="margin-top:8px"><div class="row between"><div><h3>Semaine ${w.n} · ${esc(w.phase)}</h3><div class="muted small">${fShort(planWs)} – ${fShort(addD(planWs, 6))}${w.kind === "deload" ? " · semaine allégée" : w.kind === "taper" ? " · affûtage" : w.kind === "race" ? " · semaine de course" : ""}</div></div>
  <div style="text-align:right"><div class="num" style="font-size:22px;font-weight:700">${planWs <= t ? r1(rv.done) + " / " : ""}${w.volKm} km</div><div class="xs muted">${planWs <= t ? "réalisé / prévu" : "prévu"}</div></div></div>
  ${planWs <= t ? `<div class="prog" style="margin-top:10px"><i style="width:${Math.min(100, 100 * rv.done / (w.volKm || 1))}%"></i></div><div class="row between xs muted" style="margin-top:6px"><span>Séances validées : ${rv.valid}/${rv.tot}</span>${rv.easyRpe ? `<span>Effort en endurance : ${rv.easyRpe.toFixed(1)}/10</span>` : ""}</div>` : ""}</div>
  <div class="slist">${sess.map(s => sessCard(s)).join("")}</div>
  ${extra.length ? `<div class="dayh">Hors plan</div>${extra.map(a => `<div class="card sess tap" data-a="editact" data-id="${a.id}"><div class="band band-off"><span class="bn">+</span></div><div class="grow"><div class="row between"><h3>${esc(tName(a))}</h3><span class="st st-skip">${fShort(a.date)}</span></div><div class="meta"><span><b class="num">${fDur(a.dureeMin)}</b></span>${a.distanceKm ? `<span><b class="num">${a.distanceKm}</b> km</span>` : ""}<span>Effort ${a.rpe}/10</span></div></div></div>`).join("")}` : ""}
  <button class="link" data-a="add" style="margin:10px 0 0">Ajouter une activité hors plan</button>
  <div class="sec"><details class="card"><summary class="row between"><span>Historique des ajustements</span><span class="muted small">${p.journal.length}</span></summary>${p.journal.map(j => `<p class="small" style="margin-top:10px"><b>${fShort(j.date)}</b> · ${esc(j.msg)}</p>`).join("")}</details></div>`;
}

/* --- Analyse --- */
function vStats() {
  const t = today(), p = S.plan, f = fc();
  if (p) snapshotProjection();
  const pm = pmc(S.acts, f.max, f.rep, t, 84);
  const weeks = []; for (let k = 11; k >= 0; k--) { const ws = addD(mondayOf(t), -7 * k); const w = weekOf(ws); weeks.push({ ws, done: runKm(actsBetween(ws, addD(ws, 6))), plan: w ? w.volKm : null }); }
  const ef = efficiency().slice(-15), inten = intensity();
  const P = p ? paces(p.vdot) : null;
  return `<div class="top"><h1>Analyse</h1></div>
  ${p ? (() => { const pr = projection(), o = objA(); return `<div class="card sec"><div class="row between"><h3>Projection jour J</h3><span class="xs muted">${fDate(p.prm.raceDate)}</span></div>
    <div class="statstrip" style="margin-top:12px"><div><div class="k">Visé jour J</div><div class="v" style="font-size:22px">${fmtTime(pr.race)}</div><div class="xs muted">${fmtTime(pr.lo)}–${fmtTime(pr.hi)}</div></div>
    <div><div class="k">Aujourd’hui</div><div class="v" style="font-size:22px">${fmtTime(pr.now)}</div><div class="xs muted">si tu courais demain</div></div>
    <div><div class="k">Progrès</div><div class="v" style="font-size:22px">${pr.rate >= 0 ? "+" : ""}${pr.rate.toFixed(2)}</div><div class="xs muted">pt de niveau / sem.</div></div></div>
    ${projChart(p.projHist || [], o?.cibleSec)}
    <details class="why"><summary>Comment c’est calculé</summary><p>Aujourd’hui : ton niveau actuel (équivalent 10 km ${fmtTime(predictSec(p.vdot, 10000))}) étendu à la distance avec un facteur de fatigue de ${pr.kNow.toFixed(3)} (1,06 pour un coureur moyen). ${pr.kSrc === "course longue" ? "Il vient de ta dernière course ou test longs." : pr.kSrc === "record" ? `Au départ, il vient de ton record sur la distance (${pr.kp.toFixed(2)}, pondéré selon son ancienneté : ${pr.kStart.toFixed(3)}), puis il baisse à mesure que ta sortie longue progresse (${Math.round(pr.progress * 100)} % du chemin vers ${Math.round(Math.min(p.prm.distKm * 0.8, 32))} km).` : "Il baisse à mesure que ta sortie longue progresse."} Méthode : Riegel (1981) personnalisée selon Vickers et Vertosick (2016). Équivalence théorique sans correction : ${fmtTime(pr.equiv)}.<br><br>Visé jour J : niveau projeté à ${pr.vR.toFixed(1)} (${pr.measured ? `progression mesurée sur ${pr.nObs} points` : "progression estimée d’après ton profil"}, ${pr.rate >= 0 ? "+" : ""}${pr.rate.toFixed(2)} pt/semaine), et écart d’endurance réduit de ${Math.round(pr.closure * 100)} % par le plan (facteur ${pr.kRace.toFixed(3)}).${pr.adh < 1 ? ` Réduit car le plan n’est suivi qu’à ${Math.round(pr.adh * 100)} %.` : ""} Tout se recalcule avec tes séances : sorties longues, fractions, tests et courses. Les taux de réduction de l’écart (60 % à 3 sorties, 70 % à 4) sont des estimations de l’appli.</p></details></div>`; })() : ""}
  <div class="card sec"><h3>Forme, fatigue, fraîcheur</h3>${pmChart(pm)}<div class="legend"><span><i style="background:var(--accent)"></i>Forme</span><span><i style="background:var(--c-I)"></i>Fatigue</span><span><i style="background:var(--c-E)"></i>Fraîcheur</span></div><details class="why"><summary>Comment c’est calculé</summary><p>Modèle impulsion-réponse de Banister : forme = charge moyenne sur 42 jours, fatigue = sur 7 jours, fraîcheur = forme − fatigue. Charge calculée sur ta FC, à défaut sur l’effort ressenti. Fiable après environ 6 semaines de données. Le jour de la course, on vise une fraîcheur positive.</p></details></div>
  ${p ? volCard() : `<div class="card sec"><h3>Volume par semaine</h3>${volChart(weeks)}</div>`}
  <div class="card sec"><h3>Répartition de l’intensité · 4 semaines</h3>${inten ? `<div class="prog" style="height:14px;margin-top:12px"><i style="width:${inten.easy * 100}%;background:var(--c-E)"></i><s style="left:80%"></s></div><div class="row between small" style="margin-top:8px"><span><b class="num">${Math.round(inten.easy * 100)} %</b> facile</span><span class="muted">cible ≥ 80 %</span><span><b class="num">${Math.round(100 - inten.easy * 100)} %</b> intense</span></div>` : `<p class="muted small" style="margin-top:8px">Saisis tes sorties pour voir la répartition.</p>`}</div>
  <div class="card sec"><h3>Rendement cardio</h3>${ef.length >= 2 ? efChart(ef) : `<p class="muted small" style="margin-top:10px">Saisis au moins deux sorties faciles avec ta fréquence cardiaque moyenne.</p>`}<details class="why"><summary>Comment c’est calculé</summary><p>Mètres parcourus par battement de cœur sur tes sorties faciles (on parle aussi d’efficacité aérobie). Si la courbe monte, tu cours plus vite pour le même effort : c’est le signe de progrès le plus fiable.</p></details></div>
  ${p ? `<div class="card sec"><div class="row between"><h3>Tes allures</h3><span class="num" style="font-weight:700">VMA ${vmaKmhOf(p.vdot).toFixed(1)} km/h</span></div><table class="tbl" style="margin-top:8px">

const MIN_PREP = { 5: 6, 10: 8, 21.1: 10, 42.2: 14 }, RECOV = { 5: 1, 10: 1, 21.1: 2, 42.2: 4 }, TAPER_D = { 5: 7, 10: 7, 21.1: 14, 42.2: 21 };
function objList() {
  const t = today(), p = S.plan;
  const obs = S.objectifs.filter(o => o.date >= t).sort((a, b) => a.date.localeCompare(b.date));
  const role = o => o.priorite === "B" ? "Intermédiaire" : p && p.objId === o.id ? "Principal · plan en cours" : "Principal · à venir";
  return `<div class="sec"><div class="sec-h"><h2>Mes objectifs</h2><button class="link" data-a="objadd">Ajouter</button></div>
  ${obs.length ? `<div class="card">${obs.map(o => `<div class="jr"><div class="sq" style="background:${o.priorite === "B" ? "var(--c-X)" : "var(--ink)"};color:var(--bg)">${o.priorite === "B" ? "B" : "A"}</div><div class="grow"><b>${esc(o.titre)}</b><div class="xs muted">${role(o)} · ${fDate(o.date)} · ${o.distKm < 6 ? "5 km" : o.distKm < 12 ? "10 km" : o.distKm < 30 ? "semi" : "marathon"}${o.cibleSec ? " · cible " + fmtTime(o.cibleSec) : ""}</div></div><span class="num muted small">J-${daysBetween(t, o.date)}</span><button class="iconbtn" style="width:34px;height:34px" data-a="objdel" data-id="${o.id}" aria-label="Supprimer ${esc(o.titre)}">${I.x}</button></div>`).join("")}</div>` : `<div class="card muted small">Aucun objectif à venir.</div>`}
  <button class="btn btn-s btn-b" style="margin-top:10px" data-a="objadd">Ajouter un objectif</button></div>`;
}
function checkObjective(o) {
  const t = today(), dk = distKey(o.distKm), p = S.plan;
  const A = S.objectifs.filter(x => x.priorite === "A" && x.id !== o.id && x.date >= t);
  if (o.priorite === "A") {
    const w = daysBetween(t, o.date) / 7;
    if (w < MIN_PREP[dk]) return `Trop proche pour un objectif principal : il faut au moins ${MIN_PREP[dk]} semaines de préparation pour cette distance (il en reste ${Math.floor(w)}). Ajoute-la plutôt en course intermédiaire.`;
    for (const x of A) {
      const [e, l] = x.date <= o.date ? [x, o] : [o, x];
      const gap = daysBetween(e.date, l.date) / 7, need = MIN_PREP[distKey(l.distKm)] + RECOV[distKey(e.distKm)];
      if (gap < need) return `Trop proche de « ${x.titre} » (${fDate(x.date)}) : entre deux objectifs principaux, il faut ${RECOV[distKey(e.distKm)]} semaine${RECOV[distKey(e.distKm)] > 1 ? "s" : ""} de récupération puis ${MIN_PREP[distKey(l.distKm)]} semaines de préparation, soit ${need} semaines. Il y en a ${Math.floor(gap)}. Ajoute-la en course intermédiaire, ou choisis une autre date.`;
    }
    return null;
  }
  if (!p || p.prm.raceDate < t) return "Une course intermédiaire s’insère dans un plan en cours : crée d’abord ton objectif principal.";
  if (o.date < p.weeks[0].ws || o.date > p.prm.raceDate) return `Une course intermédiaire doit avoir lieu pendant ton plan, entre le ${fDate(p.weeks[0].ws)} et le ${fDate(p.prm.raceDate)}.`;
  const dA = distKey(p.prm.distKm);
  if (dk > dA) return "Une course intermédiaire doit être plus courte que ton objectif principal.";
  if (daysBetween(o.date, p.prm.raceDate) < TAPER_D[dA]) return `Trop proche de « ${p.prm.raceName} » : pas de course dans les ${TAPER_D[dA] / 7} dernières semaines, c’est la période d’affûtage.`;
  return null;
}

const INJ_ZONES = ["Mollet", "Tendon d’Achille", "Genou", "Bandelette ilio-tibiale", "Tibia (périostite, fracture de fatigue)", "Pied / voûte plantaire", "Cheville", "Ischio-jambiers", "Quadriceps", "Hanche / fessier", "Dos", "Autre"];
function injRule(f) {
  const inj = f.hasInj === "oui" ? f.inj.filter(x => x.mois) : [], t = today().slice(0, 7);
  const months = m => { const [y1, m1] = m.split("-").map(Number), [y2, m2] = t.split("-").map(Number); return (y2 - y1) * 12 + (m2 - m1); };

        if (!f.titre.trim()) return err("Donne un nom à la course."); if (!f.date || f.date < addD(today(), 7)) return err("La date doit être au moins dans une semaine.");
        if (f.cible && !raceMin(f.cible, +f.distKm)) return err("Chrono visé illisible : utilise h:mm:ss ou mm:ss.");
        { const chk = checkObjective({ id: o0?.id, distKm: +f.distKm, date: f.date, priorite: f.priorite }); if (chk) return err(chk); }
        if (f.priorite === "A" && S.plan && S.plan.prm.raceDate >= today() && S.plan.objId !== o0?.id && f.date > S.plan.prm.raceDate) { const o = { id: o0?.id || uid(), titre: f.titre.trim(), distKm: +f.distKm, date: f.date, cibleSec: f.cible ? Math.round(raceMin(f.cible, +f.distKm) * 60) : null, priorite: "A" }; S.objectifs = S.objectifs.filter(x => x.id !== o.id).concat(o); save(); closeSheet(); render(); toast(`Objectif ajouté : son plan sera construit après ${S.plan.prm.raceName}`); return; }
        if (f.priorite === "B") { const o = { id: o0?.id || uid(), titre: f.titre.trim(), distKm: +f.distKm, date: f.date, cibleSec: f.cible ? Math.round(raceMin(f.cible, +f.distKm) * 60) : null, priorite: "B" }; S.objectifs = S.objectifs.filter(x => x.id !== o.id).concat(o); if (S.plan) { insertBRaces(S.plan.weeks); } save(); closeSheet(); render(); toast(S.plan ? "Course intermédiaire ajoutée au plan" : "Course ajoutée"); return; }
      }
      if (st === 1) { const c = calc(); if (!c.vdot || c.vdot < 20 || c.vdot > 85) return err(f.noPerf ? "Indique ton allure de footing (ex. 6:15)." : "Indique le temps de ta course récente (ex. 48:32)."); }
      if (st === 2) { if (num(f.v0) == null || num(f.longest) == null) return err("Renseigne ton volume et ta plus longue sortie (0 si tu reprends)."); }
      if (st === 3 && f.prep === "oui" && !f.prepDate) return err("Indique la date de la course de ta préparation.");
      if (st === 5 && f.hasInj === "oui" && f.inj.some(x => !x.mois)) return err("Indique le mois de chaque blessure.");
      if (st < 6) { f.step++; draw(); return; }
      const { vdot, src } = calc();
      if (S.plan && S.plan.prm.raceDate >= today() && !redo && S.plan.objId !== o0?.id && !confirm("Cet objectif arrive avant celui de ton plan en cours. Construire le plan pour cet objectif ? L’autre restera dans ta liste et aura son propre plan ensuite.")) return;
      S.profile.fcMax = f.fcMax; S.profile.fcRepos = f.fcRepos;
      const o = { id: o0?.id || uid(), titre: f.titre.trim(), distKm: +f.distKm, date: f.date, cibleSec: f.cible ? Math.round(raceMin(f.cible, +f.distKm) * 60) : null, priorite: "A" };
      S.objectifs = S.objectifs.filter(x => x.id !== o.id).concat(o);
      const v0 = startVol(f), ir = injRule(f);
      const q = { anc: f.anc, perfD: +f.perfD, perfT: f.perfT, perfDate: f.perfDate, v0: r1(v0), longest: Math.max(num(f.longest) || 0, 5), cur: f.cur, runs: f.runs, test6: !!f.test6, inj: f.hasInj === "oui" ? f.inj.filter(x => x.mois) : [], exp: +f.exp, rec: f.rec, recAge: f.recAge, tr: { qual: +f.qual, types: f.types, lastInt: f.lastInt, prep: f.prep, prepDist: +f.prepDist, prepDate: f.prepDate, off: f.off, recup: f.recup }, opt: trainOpt(f).opt, prog: ir.prog, lrStep: ir.lrStep, douleurInj: ir.gene, douleur: f.douleur, vdot, vdotSrc: src };
      createPlan(o, q); closeSheet(); planWs = null; location.hash = "plan"; render(); toast("Plan créé");
    };
  };
  draw();
}

    const ra = $("#af [data-repadd]"); if (ra) ra.onclick = () => { keep(); f.reps.push({ ...f.reps[f.reps.length - 1], fc: null, ...(f.reps[f.reps.length - 1].mode === "d" ? { s: null } : { d: null }) }); draw(); };

      out.innerHTML = pace ? fmtPace(pace) + "/km · " + (dev == null ? "" : Math.abs(dev) <= 2 ? `<span class="good">dans la cible</span>` : dev < 0 ? `<span class="warn">${Math.abs(dev).toFixed(0)} % trop vite</span>` : `<span class="warn">${dev.toFixed(0)} % trop lent</span>`) : "";
    }));

    ["#a2", "#a3"].forEach(s => $(s) && $(s).addEventListener("input", up)); up();
    if ($("#adel")) $("#adel").onclick = () => { if (!confirm("Supprimer cette activité ?")) return; S.acts = S.acts.filter(a => a.id !== f.id); relinkAll(); save(); closeSheet(); render(); };
    $("#asave").onclick = () => {
      keep(); const dur = f.sport === "muscu" ? num(f.dur) : parseDur(f.dur);
      if (!dur) { $("#aerr").textContent = "Indique la durée."; return; }
      if (f.sport === "course" && !num(f.km)) { $("#aerr").textContent = "Indique la distance."; return; }
      const a = { id: f.id || uid(), date: f.date, sport: f.sport, type: f.type, dureeMin: dur, distanceKm: num(f.km), fcMoy: num(f.fcMoy), fcMax: num(f.fcMax), cadence: num(f.cadence), deniv: num(f.deniv), rpe: +f.rpe, douleur: f.douleur || false, notes: (f.notes || "").trim() };

function sessSelect(f) {
  const w = weekOf(mondayOf(f.date || today())) || (f.sessId && allSessions().find(x => x.id === f.sessId) ? weekOf(allSessions().find(x => x.id === f.sessId).ws) : null); if (!w) return "";
  let opts = w.sessions.slice().sort((a, b) => a.ord - b.ord).filter(x => x.statut !== "fait" || x.actId === f.id);
  const pre = f.sessId && f.sessId !== "auto" && f.sessId !== "none" ? allSessions().find(x => x.id === f.sessId) : null;
  if (pre && !opts.includes(pre)) opts = [pre].concat(opts);   // séance choisie depuis une autre semaine
  return `<div><label class="f" for="asess">Séance du plan</label><select class="inp" id="asess"><option value="auto" ${f.sessId === "auto" ? "selected" : ""}>Associer automatiquement</option>${opts.map(x => `<option value="${x.id}" ${f.sessId === x.id ? "selected" : ""}>Séance ${x.ord + 1} · ${esc((TYPES[x.type] || TYPES.E).n)} · ${esc(x.titre)}</option>`).join("")}<option value="none" ${f.sessId === "none" ? "selected" : ""}>Hors plan</option></select></div>`;
}

/* --- Ajustement séance par séance ---
   Après une séance de travail validée : fractions plus rapides que la cible avec un effort ≤ 7/10 → la prochaine séance
   de cette famille monte d'un palier ; fractions trop lentes ou effort ≥ 9/10 → elle descend d'un palier.
   Sans détail des fractions : effort ≤ 5/10 → +1, ≥ 9/10 → −1. Ajustement borné à ±2 paliers. */
function sessionFeedback(a, s) { return ""; }

/* --- Séance manquée : on garde l'essentiel de la semaine ---
   Une séance prioritaire (travail, sortie longue) qui saute prend la place du footing restant le moins prioritaire.
   Un footing qui saute n'est pas remplacé. L'écart de volume est jugé lundi par le recalcul. */
function toggleSkip(id) {
  const s = allSessions().find(x => x.id === id); if (!s) return "";
  const w = weekOf(s.ws);
  if (s.statut === "saute") {
    s.statut = "prevu";
    if (s.movedTo) { const e = w.sessions.find(x => x.id === s.movedTo); if (e && e.prev && e.statut !== "fait") { Object.assign(e, e.prev); delete e.prev; delete e.movedFrom; } delete s.movedTo; }
    w.volKm = r1(w.sessions.reduce((q, x) => q + x.km, 0)); return "";
  }
  s.statut = "saute";
  if (s.type === "E" || s.type === "REC" || s.race || s.fam === "EF" || s.fam === "MOY") return "Footing sauté : pas de rattrapage, la semaine garde ses séances importantes.";
  const target = w.sessions.filter(x => x.statut === "prevu" && x.id !== s.id && (x.type === "E" || x.type === "REC") && !x.movedFrom).sort((a, b) => b.prio - a.prio)[0];
  if (!target) return "Séance importante sautée. Le recalcul de lundi en tiendra compte.";
  const F = ["type", "titre", "km", "durMin", "details", "mot", "key", "light", "prio", "fam", "tkey", "util", "cont", "zone"];
  target.prev = Object.fromEntries(F.map(k => [k, target[k]]));
  Object.assign(target, Object.fromEntries(F.map(k => [k, s[k]])), { mot: s.mot + " Séance reprogrammée à la place d’un footing : garde au moins un jour facile avant et après.", light: false, movedFrom: s.id });
  s.movedTo = target.id;
  w.volKm = r1(w.sessions.reduce((q, x) => q + x.km, 0));
  return `Séance reprogrammée en S${target.ord + 1}, à la place d’un footing.`;
}

  if (p) {

    const phases = []; p.weeks.forEach(w => { const l = phases[phases.length - 1]; if (l && l.phase === w.phase) l.semaines++; else phases.push({ phase: w.phase, semaines: 1, debut: w.ws }); });
    data = { ...data, objectif: { course: p.prm.raceName, date: p.prm.raceDate, distanceKm: p.prm.distKm, chronoVise: o?.cibleSec ? fmtTime(o.cibleSec) : "non fixé" },
      plan: { planType: p.prm.tplId, dureeSemaines: p.weeks.length, seancesParSemaine: p.prm.runs, demarrage: p.weeks[0].ws, statut: started ? `en cours, semaine ${i + 1}` : `pas encore démarré (démarre le ${p.weeks[0].ws}, le coureur court librement d’ici là)`, phases },
      niveau: { indice: +p.vdot.toFixed(1), vmaUtiliseeKmh: +vmaKmhOf(p.vdot).toFixed(1), chronoEstimeAujourdhui: fmtTime(pr.now), chronoEstimeSiPlanSuivi: fmtTime(pr.race), fourchetteJourJ: fmtTime(pr.lo) + " – " + fmtTime(pr.hi), allureSpecifique: `${fmtPace(nowPaceOf(p))} → ${fmtPace(goalPaceOf(p))}/km` },
      questionnaire: { ancienneteCourse: p.q.anc, coursesSurLaDistance: p.q.exp, record: p.q.rec || undefined, ancienneteRecord: p.q.recAge, perfRecente: p.q.perfT ? `${p.q.perfD} km en ${p.q.perfT} (${p.q.perfDate || "date ?"})` : undefined, blessure: p.q.bless === "oui" ? p.q.blessZone || "oui" : "non" },
      semaines: started ? [wk(p.weeks[i]), wk(p.weeks[i + 1])] : [wk(p.weeks[0]), wk(p.weeks[1])],
